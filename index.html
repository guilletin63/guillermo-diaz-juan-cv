<style>
:root{
  --paper:#E8ECEF; --panel:#FFFFFF; --ink:#142433; --muted:#5A6B7B;
  --rule:#C9D2D9; --signal:#1B5E8C; --mark:#B25E00; --mark-soft:#FBEFE1;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;font-weight:400;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
a{color:var(--signal);text-decoration:none;border-bottom:1px solid rgba(27,94,140,.35)}
a:hover{border-bottom-color:var(--signal)}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

/* ---------- header ---------- */
.masthead{border-bottom:1px solid var(--rule);background:var(--panel)}
.masthead .wrap{padding-top:34px;padding-bottom:28px}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
h1{
  margin:0;font-size:clamp(2.1rem,5.2vw,3.4rem);font-weight:600;
  letter-spacing:-.025em;line-height:1.02;
}
.headline{margin:.5rem 0 0;font-size:clamp(1rem,2.2vw,1.2rem);color:var(--muted);font-weight:500}
.contact{margin:1.4rem 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 26px;font-size:.88rem;color:var(--muted)}
.contact .permit{
  font-weight:600;color:var(--ink);
  background:var(--mark-soft);border:1px solid #E8D3B6;
  border-radius:2px;padding:2px 9px;
}
.langs{display:flex;gap:0;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:none}
.langs button{
  font-family:inherit;font-size:.82rem;font-weight:500;letter-spacing:.04em;
  padding:7px 14px;border:0;background:var(--panel);color:var(--muted);cursor:pointer;
}
.langs button+button{border-left:1px solid var(--rule)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}

.head-actions{display:flex;align-items:flex-start;gap:10px;flex:none}
.pdf{
  font-family:inherit;font-size:.82rem;font-weight:500;letter-spacing:.04em;
  padding:7px 14px;border:1px solid var(--ink);border-radius:2px;
  background:var(--ink);color:#fff;cursor:pointer;
}
.pdf:hover{background:#000}

/* ---------- proof strip ---------- */
.proof{
  margin:0 0 30px;padding:18px 0;list-style:none;
  display:flex;flex-wrap:wrap;gap:14px 40px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.proof li{display:flex;flex-direction:column;gap:2px;max-width:30ch}
.proof b{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1;font-family:var(--mono)}
.proof span{font-size:.84rem;color:var(--muted)}

/* ---------- hero diagram ---------- */
.hero{background:var(--panel);border-bottom:1px solid var(--rule)}
.hero .wrap{padding:36px 24px 40px}
.lede{max-width:66ch;margin:0 0 30px;font-size:1.02rem}
.lede strong{font-weight:600}

/* ---------- diagram ---------- */
.dg{margin:0}
.dg svg{width:100%;height:auto;display:block;overflow:visible}
.dg .cap{margin:14px 0 0;font-size:.84rem;color:var(--muted);max-width:70ch}
.dg-title{font-size:.95rem;font-weight:600;margin:0 0 14px}
.node rect{fill:var(--panel);stroke:var(--ink);stroke-width:1.5}
.node .nm{font-size:15px;font-weight:600;fill:var(--ink)}
.node .sb{font-size:12px;fill:var(--muted)}
.node.soft rect{stroke:var(--rule);stroke-dasharray:4 4}
.node.hit rect{stroke:var(--mark);stroke-width:2.5;fill:var(--mark-soft)}
.node.hit .nm{fill:var(--mark)}
.edge{fill:none;stroke:var(--signal);stroke-width:1.5}
.edge.dash{stroke-dasharray:5 4;stroke:var(--muted)}
.elabel{font-size:11.5px;fill:var(--muted)}
.node rect,.node .nm{transition:fill .18s ease,stroke .18s ease}

/* ---------- layout ---------- */
.columns{display:grid;grid-template-columns:270px 1fr;gap:48px;align-items:start;padding:44px 0 72px}
.rail{position:sticky;top:24px}
.rail h2,.work h2{font-size:.95rem;font-weight:600;margin:0 0 12px}
.search{position:relative}
.search input{
  width:100%;font-family:inherit;font-size:.92rem;padding:10px 32px 10px 12px;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel);color:var(--ink);
}
.search input::placeholder{color:#94A3AE}
.search button{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;
  cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:4px 7px;
}
.count{margin:10px 0 22px;font-size:.82rem;color:var(--muted)}
.count.on{color:var(--mark)}
.grp{margin:0 0 20px}
.grp h3{font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:var(--mono);font-size:.72rem;line-height:1;padding:5px 7px;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel);color:var(--muted);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#fff}
.chip.dim{opacity:.32}

/* ---------- work ---------- */
.job{border-top:1px solid var(--rule);padding:26px 0 4px}
.job:first-of-type{border-top:0;padding-top:0}
.job-head{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
.job-head h3{margin:0;font-size:1.32rem;font-weight:600;letter-spacing:-.01em}
.job-dates{font-size:.85rem;color:var(--signal);font-weight:500;white-space:nowrap}
.job-place{margin:.25rem 0 0;font-size:.85rem;color:var(--muted)}
.entry{padding:22px 0 4px;border-bottom:1px dotted var(--rule)}
.job .entry:last-of-type{border-bottom:0}
.entry-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sector{
  font-size:.74rem;font-weight:600;color:var(--panel);background:var(--ink);
  padding:3px 8px;border-radius:2px;letter-spacing:.01em;
}
.entry-head h4{margin:0;font-size:1.02rem;font-weight:600}
.entry-link{font-family:var(--mono);font-size:.74rem;overflow-wrap:anywhere}
.entry ul{margin:0;padding-left:1.05em;max-width:74ch}
.entry li{margin:0 0 6px;font-size:.94rem}
.entry li::marker{color:var(--signal)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 0}
.tag{
  font-family:var(--mono);font-size:.71rem;line-height:1;padding:4px 6px;border-radius:2px;
  border:1px solid var(--rule);color:var(--muted);background:var(--panel);cursor:pointer;
}
.tag:hover{border-color:var(--ink);color:var(--ink)}
.tag.on{border-color:var(--mark);color:var(--mark);background:var(--mark-soft)}
mark{background:var(--mark-soft);color:var(--mark);padding:0 1px;border-radius:2px}
.entry.out,.job.out{display:none}
.embed{margin:20px 0 6px;padding:18px 20px;border:1px solid var(--rule);border-radius:2px;background:var(--panel)}
.empty{padding:40px 0;color:var(--muted);max-width:60ch}

/* ---------- tail ---------- */
.tail{border-top:1px solid var(--rule);background:var(--panel)}
.tail .wrap{padding:38px 24px 54px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:34px}
.tail h2{font-size:.95rem;font-weight:600;margin:0 0 10px}
.tail p,.tail li{font-size:.9rem;margin:0 0 5px;color:var(--ink)}
.tail ul{margin:0;padding-left:1.05em}
.tail .yr{color:var(--muted);font-size:.85rem}
.colophon{border-top:1px solid var(--rule);font-size:.8rem;color:var(--muted)}
.colophon .wrap{padding:16px 24px 26px}

@media (max-width:900px){
  .columns{grid-template-columns:1fr;gap:30px;padding-top:30px}
  .rail{position:static}
  .chips{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:14mm}
  .rail,.langs,.head-actions,.colophon,.search,.count,.tags,.embed,.dg{display:none!important}
  html,body{background:#fff;color:#000;font-size:10.5pt}
  .wrap{max-width:none;padding:0}
  .columns{display:block;padding:0}
  .masthead,.hero,.tail{border:0;background:#fff}
  .masthead .wrap{padding:0 0 10px}
  .hero .wrap{padding:10px 0}
  a{color:#000;border:0}
  h1{font-size:22pt}
  .entry.out,.job.out{display:block!important}
  .entry{break-inside:avoid;page-break-inside:avoid}
  .job{break-inside:auto}
  .work h2{margin-top:6px}
  .proof{border-color:#999}
  .contact .permit{background:none;border:0;padding:0;font-weight:700}
  .proof b{font-size:14pt}
  .lede{max-width:none}
  mark{background:none;color:inherit;font-weight:inherit}
}
</style>
</head>

}

/* ============================ render ============================ */

let lang = (navigator.language||"es").toLowerCase().startsWith("en") ? "en" : "es";
let query = "";
let active = [];

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function highlight(text){
  if(!query) return esc(text);
  const n = norm(text), q = norm(query);
  let out = "", i = 0, k;
  while((k = n.indexOf(q, i)) !== -1){
    out += esc(text.slice(i,k)) + "<mark>" + esc(text.slice(k,k+query.length)) + "</mark>";
    i = k + query.length;
  }
  return out + esc(text.slice(i));
}

const hasTech = t => active.indexOf(t) !== -1;

function entryMatches(e){
  for(var i=0;i<active.length;i++) if(e.tech.indexOf(active[i]) === -1) return false;
  if(!query) return true;
  const q = norm(query);
  const hay = [e.sector[lang], e.title[lang], ...e.lines[lang], ...e.tech].join(" ");
  return norm(hay).indexOf(q) !== -1;
}

function diagramHTML(key){
  const d = DIAGRAMS[key];
  return '<div class="dg"><p class="dg-title">'+esc(d.title[lang])+'</p>'+
    d.svg(d.labels[lang]) + '<p class="cap">'+esc(d.cap[lang])+'</p></div>';
}

function renderStatic(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  $("#headline").textContent = u.headline;
  $("#lede").textContent = u.lede;
  $("#filter-title").textContent = u.filters;
  $("#work-title").textContent = u.work;
  $("#q").setAttribute("aria-label", u.qLabel);
  $("#q").placeholder = u.qPlaceholder;
  $("#empty").textContent = u.empty;
  $("#colophon").textContent = u.colophon;

  $("#contact").innerHTML =
    u.contact.map(c => "<li>"+esc(c)+"</li>").join("") +
    '<li><a href="mailto:'+u.mail+'">'+u.mail+'</a></li>' +
    '<li><a href="https://www.linkedin.com/in/guillermo-diaz-juan/" rel="me">'+u.linkedin+'</a></li>' +
    '<li class="permit">'+esc(u.permit)+'</li>';

  $("#proof").innerHTML = u.proof.map(p =>
    '<li><b>'+esc(p[0])+'</b><span>'+esc(p[1])+'</span></li>').join("");
  $("#print-cv").textContent = u.print;

  $("#hero-diagram").innerHTML = diagramHTML("posture");

  const order = ["cloud","sec","ops","app"];
  $("#groups").innerHTML = order.map(g => {
    const list = Object.keys(TECHS).filter(t => TECHS[t] === g);
    return '<div class="grp"><h3>'+esc(u.groups[g])+'</h3><div class="chips">'+
      list.map(t => '<button type="button" class="chip" data-tech="'+esc(t)+'" aria-pressed="false">'+esc(t)+'</button>').join("")+
      '</div></div>';
  }).join("");

  $("#tail").innerHTML =
    '<div><h2>'+esc(u.education)+'</h2><p>'+esc(u.eduTitle)+'</p><p class="yr">'+esc(u.eduOrg)+'</p><p class="yr">'+esc(u.eduYears)+'</p></div>'+
    '<div><h2>'+esc(u.certs)+'</h2><ul>'+u.courseList.map(c=>"<li>"+esc(c)+"</li>").join("")+'</ul></div>'+
    '<div><h2>'+esc(u.langs)+'</h2><ul>'+u.langList.map(c=>"<li>"+esc(c)+"</li>").join("")+'</ul></div>';

  document.querySelectorAll(".langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

function renderJobs(){
  const html = JOBS.map(job => {
    const entries = job.entries.map(e => {
      const on = entryMatches(e);
      return '<article class="entry'+(on?"":" out")+'">'+
        '<div class="entry-head"><span class="sector">'+esc(e.sector[lang])+'</span>'+
        '<h4>'+highlight(e.title[lang])+'</h4>'+
        (e.link ? '<a class="entry-link" href="'+esc(e.link)+'" rel="noopener">'+esc(e.link.replace("https://",""))+'</a>' : '')+'</div>'+
        '<ul>'+e.lines[lang].map(l=>"<li>"+highlight(l)+"</li>").join("")+'</ul>'+
        '<div class="tags">'+e.tech.map(t =>
          '<button type="button" class="tag'+(hasTech(t)?" on":"")+'" data-tech="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>'+
        (e.diagram ? '<div class="embed">'+diagramHTML(e.diagram)+'</div>' : '')+
      '</article>';
    });
    const anyOn = job.entries.some(entryMatches);
    return '<section class="job'+(anyOn?"":" out")+'">'+
      '<div class="job-head"><h3>'+esc(job.org)+'</h3><span class="job-dates">'+esc(job.dates[lang])+'</span></div>'+
      '<p class="job-place">'+esc(job.place[lang])+'</p>'+
      entries.join("")+
    '</section>';
  }).join("");
  $("#jobs").innerHTML = html;

  const u = UI[lang];
  const total = JOBS.reduce((n,j)=>n+j.entries.length,0);
  const shown = JOBS.reduce((n,j)=>n+j.entries.filter(entryMatches).length,0);
  const filtering = query || active.length;
  $("#count").textContent = filtering ? u.some(shown, active.join(" + ") || query) : u.all(total);
  $("#count").classList.toggle("on", !!filtering);
  $("#empty").hidden = shown !== 0;
  $("#clear").hidden = !query;

  document.querySelectorAll(".chip").forEach(c => {
    const t = c.dataset.tech;
    c.setAttribute("aria-pressed", String(hasTech(t)));
    c.classList.toggle("dim", !!query && norm(t).indexOf(norm(query)) === -1 && !hasTech(t));
  });

  document.querySelectorAll(".node[data-tech]").forEach(n => {
    const t = n.dataset.tech;
    const hot = (query && norm(t).indexOf(norm(query)) !== -1) || hasTech(t);
    n.classList.toggle("hit", !!hot);
  });
}

function toggleTech(t){
  const i = active.indexOf(t);
  i === -1 ? active.push(t) : active.splice(i,1);
  renderJobs();
}

document.addEventListener("click", ev => {
  const chip = ev.target.closest(".chip, .tag");
  if(chip){ toggleTech(chip.dataset.tech); return; }
  const lb = ev.target.closest(".langs button");
  if(lb){ lang = lb.dataset.lang; renderStatic(); renderJobs(); return; }
  if(ev.target.closest("#print-cv")){ window.print(); return; }
  if(ev.target.closest("#clear")){ query = ""; $("#q").value = ""; renderJobs(); }
});

$("#q").addEventListener("input", ev => { query = ev.target.value.trim(); renderJobs(); });

renderStatic();
renderJobs();
</script>
